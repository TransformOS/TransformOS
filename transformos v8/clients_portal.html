<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — TransformOS</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A; --navy2:#142236; --navy3:#1C2F45;
  --gold:#C9922A; --gold2:#E8B454; --gold3:#F5D48A;
  --cream:#F2EDE4; --mist:#B8C4D0; --slate:#6B7F92; --white:#fff;
  --border:rgba(201,146,42,.28); --bdim:rgba(184,196,208,.14);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --sidebar:290px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--mist);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
.tname{color:var(--white)}.tos{color:var(--gold2)}

/* GATE */
#gate{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:2rem}
#gate.hidden{display:none}
.gbox{max-width:430px;width:100%}
.glogo{font-family:var(--serif);font-size:1.9rem;font-weight:600;margin-bottom:.4rem}
.gsub{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin-bottom:2rem}
.gmsg{font-size:.92rem;margin-bottom:1.6rem;line-height:1.75}
.grow{display:flex;gap:.6rem}
#gcode{flex:1;background:var(--navy2);border:1px solid var(--bdim);color:var(--cream);padding:.9rem 1rem;font-family:var(--mono);font-size:.9rem;letter-spacing:.14em;text-transform:uppercase}
#gcode:focus{outline:none;border-color:var(--gold)}
.gbtn{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold2);color:var(--navy);border:none;padding:.9rem 1.8rem;cursor:pointer;font-weight:500}
.gbtn:hover{background:var(--gold3)}
.gerr{color:#E07A5F;font-size:.82rem;margin-top:1rem;min-height:1.3rem;line-height:1.5}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;background:var(--navy2);border-right:1px solid var(--bdim);overflow-y:auto;z-index:100;padding:2rem 0}
.sb-brand{padding:0 1.8rem 1.4rem;border-bottom:1px solid var(--bdim);margin-bottom:1.2rem}
.sb-logo{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.sb-client{font-size:.85rem;color:var(--white);margin-top:.8rem;line-height:1.3}
.sb-meta{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:.35rem}
.sb-sec{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);padding:1rem 1.8rem .5rem}
.sb-link{display:flex;gap:.8rem;align-items:baseline;padding:.62rem 1.8rem;color:var(--mist);text-decoration:none;font-size:.83rem;border-left:2px solid transparent;cursor:pointer;transition:all .18s}
.sb-link:hover{color:var(--white);background:rgba(201,146,42,.05)}
.sb-link.active{color:var(--gold2);border-left-color:var(--gold2);background:rgba(201,146,42,.07)}
.sb-num{font-family:var(--mono);font-size:.64rem;color:var(--gold);flex-shrink:0;min-width:1.1rem}
.sb-actions{padding:1.3rem 1.8rem 0;margin-top:1rem;border-top:1px solid var(--bdim);display:flex;flex-direction:column;gap:.55rem}
.sb-btn{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;padding:.6rem .9rem;border:1px solid var(--border);color:var(--gold2);background:none;cursor:pointer;text-align:left;transition:all .2s}
.sb-btn:hover{background:var(--gold2);color:var(--navy);border-color:var(--gold2)}

/* MAIN */
.main{margin-left:var(--sidebar);padding:3.2rem 4rem 7rem;max-width:1140px}
.eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:1rem}
h1.doc{font-family:var(--serif);font-size:clamp(2rem,3.6vw,3rem);font-weight:300;line-height:1.14;color:var(--white);margin-bottom:1rem}
h1.doc em{font-style:italic;color:var(--gold2)}
.lede{font-size:1rem;max-width:780px;line-height:1.8;margin-bottom:2.4rem}
.confid{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--slate);border-top:1px solid var(--bdim);padding-top:1rem;margin-top:2rem}

.toc{border:1px solid var(--bdim);background:var(--navy2);padding:1.6rem 1.8rem;margin-bottom:3rem}
.toc a{display:flex;gap:.9rem;padding:.55rem 0;color:var(--mist);text-decoration:none;font-size:.88rem;border-bottom:1px solid var(--bdim);cursor:pointer}
.toc a:last-child{border-bottom:none}
.toc a:hover{color:var(--gold2)}
.toc .n{font-family:var(--mono);font-size:.66rem;color:var(--gold);min-width:1.5rem}

.stage{display:none}
.stage.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage-head{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin-bottom:.6rem}
.stage-title{font-family:var(--serif);font-size:2.1rem;font-weight:300;color:var(--white);margin-bottom:1.8rem}

.output h1,.output h2{font-family:var(--serif);color:var(--white);font-weight:400;margin:2.2rem 0 .8rem;line-height:1.25}
.output h1{font-size:1.85rem}.output h2{font-size:1.45rem}
.output h3{font-family:var(--serif);font-size:1.18rem;color:var(--white);font-weight:600;margin:1.7rem 0 .6rem}
.output h4{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin:1.5rem 0 .5rem}
.output p{margin-bottom:1rem;max-width:850px}
.output ul,.output ol{margin:0 0 1.1rem 1.3rem}
.output li{margin-bottom:.42rem}
.output strong{color:var(--white);font-weight:500}
.output table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.85rem}
.output th{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);text-align:left;padding:.7rem .85rem;border-bottom:1px solid var(--border);font-weight:500}
.output td{padding:.7rem .85rem;border-bottom:1px solid var(--bdim);vertical-align:top}
.output tr:hover td{background:rgba(201,146,42,.03)}
.output hr{border:none;border-top:1px solid var(--bdim);margin:2rem 0}

/* OVERVIEW */
.hero-line{width:60px;height:2px;background:var(--gold);margin-bottom:1.6rem}
.headline{font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:300;color:var(--gold2);font-style:italic;line-height:1.35;max-width:860px;margin-bottom:2rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px;background:var(--bdim);margin:2.4rem 0}
.mcard{background:var(--navy2);padding:1.5rem 1.4rem}
.mval{font-family:var(--serif);font-size:2rem;font-weight:300;color:var(--gold2);line-height:1}
.mval.bad{color:#E07A5F}.mval.good{color:#7FB069}
.mlab{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--slate);margin-top:.65rem}
.mnote{font-size:.76rem;color:var(--mist);margin-top:.45rem;line-height:1.5}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2rem;margin:2.6rem 0}
.chart{border:1px solid var(--bdim);background:var(--navy2);padding:1.5rem 1.6rem}
.ctitle{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:1.2rem}
.cnote{font-size:.75rem;color:var(--slate);margin-top:1rem;line-height:1.5}
.brow{display:grid;grid-template-columns:130px 1fr 78px;gap:.8rem;align-items:center;margin-bottom:.65rem;font-size:.78rem}
.btrack{height:18px;background:rgba(184,196,208,.07)}
.bfill{height:100%;background:rgba(184,196,208,.3)}
.bfill.hi{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bval{font-family:var(--mono);font-size:.73rem;text-align:right;color:var(--mist)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--bdim);margin:2.4rem 0}
.fcard{background:var(--navy2);padding:1.6rem 1.5rem;cursor:pointer;transition:background .2s}
.fcard:hover{background:var(--navy3)}
.fnum{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}
.ftitle{font-family:var(--serif);font-size:1.2rem;color:var(--white);margin-bottom:.5rem;line-height:1.3}
.fdetail{font-size:.83rem;line-height:1.65}
.flink{font-family:var(--mono);font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);margin-top:.9rem;display:block}

/* STAGE SUMMARY + JUMP NAV */
.ssum{border-left:2px solid var(--gold);background:var(--navy2);padding:1.5rem 1.7rem;margin-bottom:1.8rem}
.ssum-h{font-family:var(--serif);font-size:1.3rem;color:var(--gold2);font-style:italic;line-height:1.35;margin-bottom:.8rem}
.ssum-p{font-size:.92rem;line-height:1.75;max-width:820px}
.ssum-m{display:flex;flex-wrap:wrap;gap:1.8rem;margin-top:1.3rem;padding-top:1.2rem;border-top:1px solid var(--bdim)}
.ssum-m div span{display:block}
.ssum-mv{font-family:var(--serif);font-size:1.35rem;color:var(--white);line-height:1}
.ssum-ml{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:.35rem}

.jump{border:1px solid var(--bdim);padding:1.1rem 1.4rem;margin-bottom:2.2rem;display:flex;flex-wrap:wrap;gap:.5rem}
.jump a{font-size:.74rem;padding:.32rem .7rem;border:1px solid var(--bdim);color:var(--mist);cursor:pointer;text-decoration:none;transition:all .18s}
.jump a:hover{border-color:var(--gold);color:var(--gold2)}

/* ASK */
.ask{position:fixed;bottom:0;right:0;width:calc(100% - var(--sidebar));background:var(--navy2);border-top:1px solid var(--border);padding:.9rem 4rem;z-index:90;display:flex;gap:.85rem;align-items:center}
.ask-lab{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
.ask input{flex:1;background:var(--navy);border:1px solid var(--bdim);color:var(--cream);padding:.75rem 1rem;font-family:var(--sans);font-size:.87rem;font-weight:300}
.ask input:focus{outline:none;border-color:var(--gold)}
.ask button{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;background:var(--gold2);color:var(--navy);border:none;padding:.8rem 1.5rem;cursor:pointer;font-weight:500}
.ask button:disabled{opacity:.45;cursor:not-allowed}
.answer{position:fixed;bottom:70px;right:2rem;width:min(640px,calc(100% - var(--sidebar) - 4rem));max-height:56vh;overflow-y:auto;background:var(--navy3);border:1px solid var(--border);padding:1.5rem 1.7rem;z-index:95;display:none;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.answer.on{display:block}
.answer-q{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);margin-bottom:.85rem;padding-bottom:.85rem;border-bottom:1px solid var(--bdim);padding-right:1.5rem}
.answer p{font-size:.89rem;margin-bottom:.75rem;color:var(--cream)}
.answer strong{color:var(--white);font-weight:500}
.aclose{position:absolute;top:.9rem;right:1.1rem;background:none;border:none;color:var(--slate);font-size:1.2rem;cursor:pointer;line-height:1}
.aclose:hover{color:var(--gold2)}
.spin{display:inline-block;width:8px;height:8px;background:var(--gold2);margin-right:.5rem;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* PRESENT */
body.present .sidebar,body.present .ask,body.present .answer,body.present .toc,body.present .confid{display:none}
body.present .main{margin-left:0;max-width:none;padding:5vh 7vw}
body.present .output p,body.present .output td{font-size:1.1rem}
body.present .stage-title{font-size:3rem}
.pbar{display:none;position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);gap:.8rem;background:var(--navy2);border:1px solid var(--border);padding:.55rem 1.1rem;z-index:200;align-items:center}
body.present .pbar{display:flex}
.pbar button{background:none;border:1px solid var(--bdim);color:var(--gold2);font-family:var(--mono);font-size:.62rem;padding:.35rem .8rem;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
.pcount{font-family:var(--mono);font-size:.64rem;color:var(--slate)}

.menu-btn{display:none;position:fixed;top:1rem;left:1rem;z-index:150;background:var(--gold2);color:var(--navy);border:none;padding:.55rem .85rem;font-family:var(--mono);font-size:.64rem;cursor:pointer}
@media(max-width:1000px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:4rem 1.3rem 7rem}
  .ask{width:100%;padding:.8rem 1.3rem}
  .answer{right:1rem;width:calc(100% - 2rem)}
  .menu-btn{display:block}
}
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#222}
  .sidebar,.ask,.answer,.pbar,.menu-btn,.toc{display:none!important}
  .main{margin:0;padding:0;max-width:none}
  .stage{display:block!important;page-break-after:always}
  .stage:last-child{page-break-after:auto}
  .stage-title,.output h1,.output h2,.output h3{color:#0D1B2A;page-break-after:avoid}
  .output th{color:#8a6418;border-bottom:1px solid #C9922A}
  .output td{color:#333;border-bottom:1px solid #ddd}
  table{page-break-inside:avoid}
  .output p{color:#333}
}
</style>
</head>
<body>

<div id="gate">
  <div class="gbox">
    <div class="glogo"><span class="tname">Transform</span><span class="tos">OS</span></div>
    <div class="gsub">Confidential client portal</div>
    <p class="gmsg">Enter the access code issued with your engagement to open your transformation.</p>
    <div class="grow">
      <input id="gcode" placeholder="Access code" autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')openPortal()">
      <button class="gbtn" onclick="openPortal()">Enter</button>
    </div>
    <div class="gerr" id="gerr"></div>
  </div>
</div>

<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">MENU</button>

<aside class="sidebar" style="display:none" id="sidebar">
  <div class="sb-brand">
    <div class="sb-logo"><span class="tname">Transform</span><span class="tos">OS</span></div>
    <div class="sb-client" id="cName"></div>
    <div class="sb-meta" id="cMeta"></div>
  </div>
  <div class="sb-sec">Overview</div>
  <a class="sb-link active" onclick="go(-1)"><span class="sb-num">—</span><span>Your Transformation</span></a>
  <div class="sb-sec">The Stages</div>
  <div id="nav"></div>
  <div class="sb-actions">
    <button class="sb-btn" onclick="window.print()">Export full report</button>
    <button class="sb-btn" onclick="boardPack()">Board pack</button>
    <button class="sb-btn" onclick="startPresent()">Presentation mode</button>
  </div>
</aside>

<main class="main" id="main" style="display:none"></main>

<div class="answer" id="answer">
  <button class="aclose" onclick="document.getElementById('answer').classList.remove('on')">&times;</button>
  <div class="answer-q" id="aq"></div>
  <div id="ab"></div>
</div>

<div class="ask" id="askbar" style="display:none">
  <span class="ask-lab">Ask <span class="tname">Transform</span><span class="tos">OS</span></span>
  <input id="q" placeholder="Ask anything about this analysis…" onkeydown="if(event.key==='Enter')ask()">
  <button id="askBtn" onclick="ask()">Ask</button>
</div>

<div class="pbar">
  <button onclick="pStep(-1)">&larr; Prev</button>
  <span class="pcount" id="pCount"></span>
  <button onclick="pStep(1)">Next &rarr;</button>
  <button onclick="endPresent()">Exit</button>
</div>

<script>
const API='/.netlify/functions';
let DATA=null, CUR=-1;
const el=id=>document.getElementById(id);

function md(t){
  const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=esc.split('\n');
  let out='',inUl=false,inTable=false;
  const closeUl=()=>{if(inUl){out+='</ul>';inUl=false;}};
  const closeTable=()=>{if(inTable){out+='</tbody></table>';inTable=false;}};
  for(let ln of lines){
    ln=ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^\s*\|.*\|\s*$/.test(ln)){
      if(/^[\s|:-]+$/.test(ln)) continue;
      const cells=ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      if(!inTable){closeUl();out+='<table><thead><tr>'+cells.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';inTable=true;}
      else out+='<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      continue;
    }
    closeTable();
    const h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){closeUl();const l=Math.min(h[1].length+1,4);out+='<h'+l+'>'+h[2]+'</h'+l+'>';continue;}
    const li=ln.match(/^\s*[-*•]\s+(.*)$/);
    if(li){if(!inUl){out+='<ul>';inUl=true;}out+='<li>'+li[1]+'</li>';continue;}
    closeUl();
    if(/^\s*---+\s*$/.test(ln)){out+='<hr>';continue;}
    if(ln.trim()==='')continue;
    out+='<p>'+ln+'</p>';
  }
  closeUl();closeTable();
  return out;
}

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function drawChart(ch){
  const series=(ch.series||[]).filter(x=>typeof x.value==='number');
  if(!series.length) return '';
  let inner='';
  if(ch.type==='donut' && series.length>=2){
    const total=series.reduce((a,b)=>a+b.value,0)||1;
    const pct=Math.round(series[0].value/total*100);
    inner='<div style="display:flex;align-items:center;gap:1.6rem">'+
      '<svg width="118" height="118" viewBox="0 0 42 42"><circle cx="21" cy="21" r="16" fill="none" stroke="rgba(184,196,208,.14)" stroke-width="7"/>'+
      '<circle cx="21" cy="21" r="16" fill="none" stroke="'+(pct>60?'#E07A5F':'var(--gold2)')+'" stroke-width="7" pathLength="100" stroke-dasharray="'+pct+' 100" transform="rotate(-90 21 21)"/></svg>'+
      '<div><div style="font-family:var(--serif);font-size:2.2rem;color:'+(pct>60?'#E07A5F':'var(--gold2)')+';line-height:1">'+pct+'%</div>'+
      '<div class="mlab">'+esc(series[0].label)+'</div></div></div>';
  } else {
    const max=Math.max(...series.map(x=>x.value))||1;
    inner=series.map(x=>'<div class="brow"><span>'+esc(x.label)+'</span>'+
      '<div class="btrack"><div class="bfill'+(x.highlight?' hi':'')+'" style="width:'+Math.max(2,x.value/max*100)+'%"></div></div>'+
      '<span class="bval">'+esc(x.display||x.value)+'</span></div>').join('');
  }
  return '<div class="chart"><div class="ctitle">'+esc(ch.title)+'</div>'+inner+
    (ch.note?'<div class="cnote">'+esc(ch.note)+'</div>':'')+'</div>';
}

function jumpNav(html, n){
  const re=/<h([23])>(.*?)<\/h\1>/g; let m, items=[], i=0;
  while((m=re.exec(html))!==null){
    const txt=m[2].replace(/<[^>]+>/g,'').trim();
    if(txt.length>1 && txt.length<70) items.push({txt, id:'s'+n+'h'+(i++)});
  }
  if(items.length<3) return '';
  return '<div class="jump">'+items.slice(0,14).map((it,ix)=>
    '<a onclick="jumpTo('+n+','+ix+')">'+esc(it.txt)+'</a>').join('')+'</div>';
}

function jumpTo(stage,index){
  const sec=document.getElementById('st'+stage);
  if(!sec) return;
  const hs=sec.querySelectorAll('.output h2, .output h3');
  const valid=[...hs].filter(h=>{const t=h.textContent.trim();return t.length>1&&t.length<70;});
  if(valid[index]) valid[index].scrollIntoView({behavior:'smooth',block:'start'});
}

async function openPortal(){
  const code=el('gcode').value.trim().toUpperCase();
  const err=el('gerr');
  if(!code){err.textContent='Enter your access code.';return;}
  err.textContent='Opening…';
  try{
    const r=await fetch(API+'/get-portal?code='+encodeURIComponent(code));
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Could not open portal';return;}
    DATA=d;
    sessionStorage.setItem('tos_portal_code',code);
    el('gate').classList.add('hidden');
    el('sidebar').style.display='';
    el('main').style.display='';
    el('askbar').style.display='';
    render();
  }catch(e){err.textContent='Could not reach the portal. Please try again.';}
}

function render(){
  const c=DATA.company;
  el('cName').textContent=c.company_name||'';
  el('cMeta').textContent='Enterprise Transformation'+(c.sector?' · '+c.sector:'');
  el('nav').innerHTML=DATA.stages.map(s=>
    '<a class="sb-link" onclick="go('+s.stage_number+')"><span class="sb-num">'+
    String(s.stage_number).padStart(2,'0')+'</span><span>'+s.stage_name+'</span></a>').join('');

  const sum = c.summary;

  let html='<section class="stage on" id="st-1">'+
    '<div class="eyebrow">Enterprise Transformation · Confidential</div>'+
    '<h1 class="doc">'+(c.company_name||'Your organisation')+'</h1>'+
    '<div class="hero-line"></div>';

  if(sum && sum.headline) html += '<div class="headline">'+esc(sum.headline)+'</div>';

  if(sum && Array.isArray(sum.metrics) && sum.metrics.length){
    html += '<div class="mgrid">'+sum.metrics.map(m=>
      '<div class="mcard"><div class="mval '+(m.tone==='bad'?'bad':m.tone==='good'?'good':'')+'">'+esc(m.value)+'</div>'+
      '<div class="mlab">'+esc(m.label)+'</div>'+(m.note?'<div class="mnote">'+esc(m.note)+'</div>':'')+'</div>').join('')+'</div>';
  }

  if(sum && sum.narrative){
    html += '<div class="output">'+md(sum.narrative)+'</div>';
  } else {
    html += '<p class="lede">Your complete transformation. '+DATA.stages.length+' stages, each building on the one before it.</p>';
  }

  if(sum && Array.isArray(sum.charts) && sum.charts.length){
    html += '<div class="cgrid">'+sum.charts.map(drawChart).join('')+'</div>';
  }

  if(sum && Array.isArray(sum.findings) && sum.findings.length){
    html += '<div class="eyebrow" style="margin-top:3rem">What we found</div>';
    html += '<div class="fgrid">'+sum.findings.map((f,i)=>
      '<div class="fcard" onclick="go('+(f.stage||1)+')">'+
      '<div class="fnum">Finding '+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="ftitle">'+esc(f.title)+'</div>'+
      '<div class="fdetail">'+esc(f.detail)+'</div>'+
      '<span class="flink">Stage '+String(f.stage||1).padStart(2,'0')+' &rarr;</span></div>').join('')+'</div>';
  }

  html += '<div class="eyebrow" style="margin-top:3rem">The stages</div>'+
    '<div class="toc">'+DATA.stages.map(st=>
      '<a onclick="go('+st.stage_number+')"><span class="n">'+String(st.stage_number).padStart(2,'0')+'</span><span>'+st.stage_name+'</span></a>').join('')+'</div>'+
    '<div class="confid">Prepared by <span class="tname">Transform</span><span class="tos">OS</span>'+
    (c.prepared? ' · '+new Date(c.prepared).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) : '')+' · Client confidential</div>'+
    '</section>';

  html+=DATA.stages.map(st=>{
    const meta = sum && Array.isArray(sum.stages) ? sum.stages.find(x=>x.stage_number===st.stage_number) : null;
    const bodyHtml = md(st.output_content||'');
    return '<section class="stage" id="st'+st.stage_number+'">'+
      '<div class="stage-head">Stage '+String(st.stage_number).padStart(2,'0')+'</div>'+
      '<div class="stage-title">'+st.stage_name+'</div>'+
      (meta ? '<div class="ssum">'+
        (meta.headline?'<div class="ssum-h">'+esc(meta.headline)+'</div>':'')+
        (meta.summary?'<div class="ssum-p">'+esc(meta.summary)+'</div>':'')+
        (Array.isArray(meta.metrics)&&meta.metrics.length?'<div class="ssum-m">'+meta.metrics.map(m=>
          '<div><span class="ssum-mv">'+esc(m.value)+'</span><span class="ssum-ml">'+esc(m.label)+'</span></div>').join('')+'</div>':'')+
        '</div>' : '')+
      jumpNav(bodyHtml, st.stage_number)+
      '<div class="output">'+bodyHtml+'</div></section>';
  }).join('');

  el('main').innerHTML=html;
}

function go(n){
  CUR=n;
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));
  const target=document.getElementById(n===-1?'st-1':'st'+n);
  if(target)target.classList.add('on');
  document.querySelectorAll('.sb-link').forEach((l,i)=>l.classList.toggle('active', i===(n===-1?0:n)));
  document.querySelector('.sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

function boardPack(){
  const keep=['st1','st2','st6','st7'];
  document.querySelectorAll('.stage').forEach(s=>{ if(!keep.includes(s.id)) s.dataset.skip='1'; });
  const style=document.createElement('style');
  style.id='bp';
  style.textContent='@media print{.stage[data-skip="1"]{display:none!important}}';
  document.head.appendChild(style);
  window.print();
  setTimeout(()=>{document.querySelectorAll('.stage').forEach(s=>delete s.dataset.skip);const b=document.getElementById('bp');if(b)b.remove();},700);
}

let pIdx=0;
function startPresent(){document.body.classList.add('present');pIdx=0;pShow();}
function endPresent(){document.body.classList.remove('present');go(CUR);}
function pStep(d){const n=document.querySelectorAll('.stage').length;pIdx=Math.max(0,Math.min(n-1,pIdx+d));pShow();}
function pShow(){
  const secs=[...document.querySelectorAll('.stage')];
  secs.forEach((s,i)=>s.classList.toggle('on',i===pIdx));
  el('pCount').textContent=(pIdx+1)+' / '+secs.length;
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('present'))return;
  if(e.key==='ArrowRight'||e.key===' ')pStep(1);
  if(e.key==='ArrowLeft')pStep(-1);
  if(e.key==='Escape')endPresent();
});

async function ask(){
  const q=el('q').value.trim(); if(!q)return;
  const btn=el('askBtn'),panel=el('answer');
  el('aq').textContent=q;
  el('ab').innerHTML='<p><span class="spin"></span>Analysing…</p>';
  panel.classList.add('on');
  btn.disabled=true;btn.textContent='…';

  const per=Math.floor(340000/Math.max(DATA.stages.length,1));
  const corpus=DATA.stages.map(s=>'───── STAGE '+s.stage_number+' — '+s.stage_name+' ─────\n'+(s.output_content||'').slice(0,per)).join('\n\n');
  const ctx='You are TransformOS, answering a question from the leadership team of '+
    (DATA.company.company_name||'this organisation')+' about their own transformation analysis. '+
    'The full engagement is below. Answer only from it. If something is not covered, say so plainly rather than inventing figures. '+
    'Where stages disagree or a later stage revises an earlier finding, say so explicitly. '+
    'Direct and commercially sharp. Distinguish evidenced fact from professional judgement. Under 220 words unless the question demands more. '+
    'Short plain paragraphs, no markdown headings, bold only the phrases that matter most.\n\n'+corpus;

  try{
    const r=await fetch(API+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1200,system:ctx,messages:[{role:'user',content:q}]})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'request failed');
    el('ab').innerHTML=md((d.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n'));
  }catch(e){ el('ab').innerHTML='<p style="color:#E07A5F">Could not answer: '+e.message+'</p>'; }
  btn.disabled=false;btn.textContent='Ask';el('q').value='';
}

/* auto-open from ?code= or a previous session */
(function(){
  const p=new URLSearchParams(location.search).get('code');
  const stored=sessionStorage.getItem('tos_portal_code');
  const code=p||stored;
  if(code){ el('gcode').value=code.toUpperCase(); openPortal(); }
  else el('gcode').focus();
})();
</script>
