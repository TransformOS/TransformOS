<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client Portal — TransformOS</title>
<meta name="robots" content="noindex,nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0D1B2A; --navy2:#142236; --navy3:#1C2F45;
  --gold:#C9922A; --gold2:#E8B454; --gold3:#F5D48A;
  --cream:#F2EDE4; --mist:#B8C4D0; --slate:#6B7F92; --white:#fff;
  --border:rgba(201,146,42,.28); --bdim:rgba(184,196,208,.14);
  --serif:'Cormorant Garamond',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
  --mono:'DM Mono',ui-monospace,monospace;
  --sidebar:290px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--navy);color:var(--mist);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased}
.tname{color:var(--white)}.tos{color:var(--gold2)}

/* GATE */
#gate{position:fixed;inset:0;background:var(--navy);z-index:9999;display:flex;align-items:center;justify-content:center;padding:2rem}
#gate.hidden{display:none}
.gbox{max-width:430px;width:100%}
.glogo{font-family:var(--serif);font-size:1.9rem;font-weight:600;margin-bottom:.4rem}
.gsub{font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin-bottom:2rem}
.gmsg{font-size:.92rem;margin-bottom:1.6rem;line-height:1.75}
.grow{display:flex;gap:.6rem}
#gcode{flex:1;background:var(--navy2);border:1px solid var(--bdim);color:var(--cream);padding:.9rem 1rem;font-family:var(--mono);font-size:.9rem;letter-spacing:.14em;text-transform:uppercase}
#gcode:focus{outline:none;border-color:var(--gold)}
.gbtn{font-family:var(--mono);font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;background:var(--gold2);color:var(--navy);border:none;padding:.9rem 1.8rem;cursor:pointer;font-weight:500}
.gbtn:hover{background:var(--gold3)}
.gerr{color:#E07A5F;font-size:.82rem;margin-top:1rem;min-height:1.3rem;line-height:1.5}

/* SIDEBAR */
.sidebar{position:fixed;top:0;left:0;width:var(--sidebar);height:100vh;background:var(--navy2);border-right:1px solid var(--bdim);overflow-y:auto;z-index:100;padding:2rem 0}
.sb-brand{padding:0 1.8rem 1.4rem;border-bottom:1px solid var(--bdim);margin-bottom:1.2rem}
.sb-logo{font-family:var(--serif);font-size:1.5rem;font-weight:600}
.sb-client{font-size:.85rem;color:var(--white);margin-top:.8rem;line-height:1.3}
.sb-meta{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:.35rem}
.sb-sec{font-family:var(--mono);font-size:.56rem;letter-spacing:.2em;text-transform:uppercase;color:var(--slate);padding:1rem 1.8rem .5rem}
.sb-link{display:flex;gap:.8rem;align-items:baseline;padding:.62rem 1.8rem;color:var(--mist);text-decoration:none;font-size:.83rem;border-left:2px solid transparent;cursor:pointer;transition:all .18s}
.sb-link:hover{color:var(--white);background:rgba(201,146,42,.05)}
.sb-link.active{color:var(--gold2);border-left-color:var(--gold2);background:rgba(201,146,42,.07)}
.sb-num{font-family:var(--mono);font-size:.64rem;color:var(--gold);flex-shrink:0;min-width:1.1rem}
.sb-actions{padding:1.3rem 1.8rem 0;margin-top:1rem;border-top:1px solid var(--bdim);display:flex;flex-direction:column;gap:.55rem}
.sb-btn{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;text-transform:uppercase;padding:.6rem .9rem;border:1px solid var(--border);color:var(--gold2);background:none;cursor:pointer;text-align:left;transition:all .2s}
.sb-btn:hover{background:var(--gold2);color:var(--navy);border-color:var(--gold2)}

/* MAIN */
.main{margin-left:var(--sidebar);padding:3.2rem 4rem 7rem;max-width:1140px}
.eyebrow{font-family:var(--mono);font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold2);margin-bottom:1rem}
h1.doc{font-family:var(--serif);font-size:clamp(2rem,3.6vw,3rem);font-weight:300;line-height:1.14;color:var(--white);margin-bottom:1rem}
h1.doc em{font-style:italic;color:var(--gold2)}
.lede{font-size:1rem;max-width:780px;line-height:1.8;margin-bottom:2.4rem}
.confid{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--slate);border-top:1px solid var(--bdim);padding-top:1rem;margin-top:2rem}

.toc{border:1px solid var(--bdim);background:var(--navy2);padding:1.6rem 1.8rem;margin-bottom:3rem}
.toc a{display:flex;gap:.9rem;padding:.55rem 0;color:var(--mist);text-decoration:none;font-size:.88rem;border-bottom:1px solid var(--bdim);cursor:pointer}
.toc a:last-child{border-bottom:none}
.toc a:hover{color:var(--gold2)}
.toc .n{font-family:var(--mono);font-size:.66rem;color:var(--gold);min-width:1.5rem}

.stage{display:none}
.stage.on{display:block;animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.stage-head{font-family:var(--mono);font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--gold2);margin-bottom:.6rem}
.stage-title{font-family:var(--serif);font-size:2.1rem;font-weight:300;color:var(--white);margin-bottom:1.8rem}

.output h1,.output h2{font-family:var(--serif);color:var(--white);font-weight:400;margin:2.2rem 0 .8rem;line-height:1.25}
.output h1{font-size:1.85rem}.output h2{font-size:1.45rem}
.output h3{font-family:var(--serif);font-size:1.18rem;color:var(--white);font-weight:600;margin:1.7rem 0 .6rem}
.output h4{font-family:var(--mono);font-size:.65rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin:1.5rem 0 .5rem}
.output p{margin-bottom:1rem;max-width:850px}
.output ul,.output ol{margin:0 0 1.1rem 1.3rem}
.output li{margin-bottom:.42rem}
.output strong{color:var(--white);font-weight:500}
.output table{width:100%;border-collapse:collapse;margin:1.5rem 0;font-size:.85rem}
.output th{font-family:var(--mono);font-size:.58rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2);text-align:left;padding:.7rem .85rem;border-bottom:1px solid var(--border);font-weight:500}
.output td{padding:.7rem .85rem;border-bottom:1px solid var(--bdim);vertical-align:top}
.output tr:hover td{background:rgba(201,146,42,.03)}
.output hr{border:none;border-top:1px solid var(--bdim);margin:2rem 0}

/* OVERVIEW */
.hero-line{width:60px;height:2px;background:var(--gold);margin-bottom:1.6rem}
.headline{font-family:var(--serif);font-size:clamp(1.5rem,2.6vw,2.1rem);font-weight:300;color:var(--gold2);font-style:italic;line-height:1.35;max-width:860px;margin-bottom:2rem}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:2px;background:var(--bdim);margin:2.4rem 0}
.mcard{background:var(--navy2);padding:1.5rem 1.4rem}
.mval{font-family:var(--serif);font-size:2rem;font-weight:300;color:var(--gold2);line-height:1}
.mval.bad{color:#E07A5F}.mval.good{color:#7FB069}
.mlab{font-family:var(--mono);font-size:.58rem;letter-spacing:.15em;text-transform:uppercase;color:var(--slate);margin-top:.65rem}
.mnote{font-size:.76rem;color:var(--mist);margin-top:.45rem;line-height:1.5}

.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:2rem;margin:2.6rem 0}
.chart{border:1px solid var(--bdim);background:var(--navy2);padding:1.5rem 1.6rem}
.ctitle{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:1.2rem}
.cnote{font-size:.75rem;color:var(--slate);margin-top:1rem;line-height:1.5}
.brow{display:grid;grid-template-columns:130px 1fr 78px;gap:.8rem;align-items:center;margin-bottom:.65rem;font-size:.78rem}
.btrack{height:18px;background:rgba(184,196,208,.07)}
.bfill{height:100%;background:rgba(184,196,208,.3)}
.bfill.hi{background:linear-gradient(90deg,var(--gold),var(--gold2))}
.bval{font-family:var(--mono);font-size:.73rem;text-align:right;color:var(--mist)}

.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:2px;background:var(--bdim);margin:2.4rem 0}
.fcard{background:var(--navy2);padding:1.6rem 1.5rem;cursor:pointer;transition:background .2s}
.fcard:hover{background:var(--navy3)}
.fnum{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem}
.ftitle{font-family:var(--serif);font-size:1.2rem;color:var(--white);margin-bottom:.5rem;line-height:1.3}
.fdetail{font-size:.83rem;line-height:1.65}
.flink{font-family:var(--mono);font-size:.56rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);margin-top:.9rem;display:block}

/* STAGE SUMMARY + JUMP NAV */
.ssum{border-left:2px solid var(--gold);background:var(--navy2);padding:1.5rem 1.7rem;margin-bottom:1.8rem}
.ssum-h{font-family:var(--serif);font-size:1.3rem;color:var(--gold2);font-style:italic;line-height:1.35;margin-bottom:.8rem}
.ssum-p{font-size:.92rem;line-height:1.75;max-width:820px}
.ssum-m{display:flex;flex-wrap:wrap;gap:1.8rem;margin-top:1.3rem;padding-top:1.2rem;border-top:1px solid var(--bdim)}
.ssum-m div span{display:block}
.ssum-mv{font-family:var(--serif);font-size:1.35rem;color:var(--white);line-height:1}
.ssum-ml{font-family:var(--mono);font-size:.55rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);margin-top:.35rem}

.jump{border:1px solid var(--bdim);padding:1.1rem 1.4rem;margin-bottom:2.2rem;display:flex;flex-wrap:wrap;gap:.5rem}
.jump a{font-size:.74rem;padding:.32rem .7rem;border:1px solid var(--bdim);color:var(--mist);cursor:pointer;text-decoration:none;transition:all .18s}
.jump a:hover{border-color:var(--gold);color:var(--gold2)}

/* SECTION DISCLOSURE */
.sec{border:1px solid var(--bdim);margin-bottom:.6rem;background:var(--navy2)}
.sec>summary{cursor:pointer;padding:1rem 1.3rem;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:1rem;transition:background .18s}
.sec>summary::-webkit-details-marker{display:none}
.sec>summary:hover{background:var(--navy3)}
.sec-t{font-family:var(--serif);font-size:1.12rem;color:var(--white);font-weight:500;line-height:1.3}
.sec-i{font-family:var(--mono);font-size:1rem;color:var(--gold);flex-shrink:0;transition:transform .2s}
.sec[open] .sec-i{transform:rotate(45deg)}
.sec-body{padding:.2rem 1.3rem 1.4rem;border-top:1px solid var(--bdim)}
.sec-body>*:first-child{margin-top:1rem}
.expand-all{font-family:var(--mono);font-size:.58rem;letter-spacing:.13em;text-transform:uppercase;background:none;border:1px solid var(--bdim);color:var(--gold2);padding:.45rem .9rem;cursor:pointer;margin-bottom:1.2rem}
.expand-all:hover{border-color:var(--gold)}

/* SPIDER + TRAJECTORY */
.wide{grid-column:1/-1}
.spider-wrap{display:flex;gap:1.8rem;align-items:center;flex-wrap:wrap}
.legend{font-size:.76rem;display:flex;gap:1.2rem;margin-top:.9rem}
.legend i{display:inline-block;width:10px;height:10px;margin-right:.4rem;vertical-align:middle}

/* MODELLER */
.mod{border:1px solid var(--border);background:var(--navy2);padding:1.8rem;margin:2.6rem 0}
.mod-grid{display:grid;grid-template-columns:290px 1fr;gap:2.2rem;align-items:start}
.ctrl{margin-bottom:1.3rem}
.ctrl-l{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);display:flex;justify-content:space-between;margin-bottom:.45rem}
.ctrl-v{color:var(--gold2)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:3px;background:rgba(184,196,208,.2);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;background:var(--gold2);cursor:pointer}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--gold2);cursor:pointer;border:none}
.presets{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:1.6rem}
.pset{font-size:.76rem;padding:.45rem .85rem;border:1px solid var(--bdim);background:none;color:var(--mist);cursor:pointer;font-family:var(--sans)}
.pset:hover{border-color:var(--gold);color:var(--gold2)}
.pset.on{background:var(--gold2);color:var(--navy);border-color:var(--gold2);font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:2px;background:var(--bdim);margin-bottom:1.6rem}
.kpi{background:var(--navy3);padding:1.1rem}
.kv{font-family:var(--serif);font-size:1.6rem;font-weight:300;color:var(--gold2);line-height:1}
.kv.bad{color:#E07A5F}.kv.good{color:#7FB069}
.kl{font-family:var(--mono);font-size:.53rem;letter-spacing:.13em;text-transform:uppercase;color:var(--slate);margin-top:.5rem}
.kd{font-family:var(--mono);font-size:.62rem;margin-top:.35rem;color:var(--slate)}
.verdict{border-left:2px solid var(--gold);padding:1rem 1.2rem;background:var(--navy3);font-size:.9rem;line-height:1.7;color:var(--cream)}
@media(max-width:900px){.mod-grid{grid-template-columns:1fr}}

/* ASK */
.ask{position:fixed;bottom:0;right:0;width:calc(100% - var(--sidebar));background:var(--navy2);border-top:1px solid var(--border);padding:.9rem 4rem;z-index:90;display:flex;gap:.85rem;align-items:center}
.ask-lab{font-family:var(--mono);font-size:.56rem;letter-spacing:.14em;text-transform:uppercase;color:var(--slate);white-space:nowrap}
.ask input{flex:1;background:var(--navy);border:1px solid var(--bdim);color:var(--cream);padding:.75rem 1rem;font-family:var(--sans);font-size:.87rem;font-weight:300}
.ask input:focus{outline:none;border-color:var(--gold)}
.ask button{font-family:var(--mono);font-size:.64rem;letter-spacing:.13em;text-transform:uppercase;background:var(--gold2);color:var(--navy);border:none;padding:.8rem 1.5rem;cursor:pointer;font-weight:500}
.ask button:disabled{opacity:.45;cursor:not-allowed}
.answer{position:fixed;bottom:70px;right:2rem;width:min(640px,calc(100% - var(--sidebar) - 4rem));max-height:56vh;overflow-y:auto;background:var(--navy3);border:1px solid var(--border);padding:1.5rem 1.7rem;z-index:95;display:none;box-shadow:0 -8px 40px rgba(0,0,0,.5)}
.answer.on{display:block}
.answer-q{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);margin-bottom:.85rem;padding-bottom:.85rem;border-bottom:1px solid var(--bdim);padding-right:1.5rem}
.answer p{font-size:.89rem;margin-bottom:.75rem;color:var(--cream)}
.answer strong{color:var(--white);font-weight:500}
.aclose{position:absolute;top:.9rem;right:1.1rem;background:none;border:none;color:var(--slate);font-size:1.2rem;cursor:pointer;line-height:1}
.aclose:hover{color:var(--gold2)}
.spin{display:inline-block;width:8px;height:8px;background:var(--gold2);margin-right:.5rem;animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}

/* PRESENT */
body.present .sidebar,body.present .ask,body.present .answer,body.present .toc,body.present .confid,body.present .expand-all{display:none}
body.present .sec-body{display:block!important}
body.present .sec{border:none;background:none}
body.present .main{margin-left:0;max-width:none;padding:5vh 7vw}
body.present .output p,body.present .output td{font-size:1.1rem}
body.present .stage-title{font-size:3rem}
.pbar{display:none;position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);gap:.8rem;background:var(--navy2);border:1px solid var(--border);padding:.55rem 1.1rem;z-index:200;align-items:center}
body.present .pbar{display:flex}
.pbar button{background:none;border:1px solid var(--bdim);color:var(--gold2);font-family:var(--mono);font-size:.62rem;padding:.35rem .8rem;cursor:pointer;letter-spacing:.1em;text-transform:uppercase}
.pcount{font-family:var(--mono);font-size:.64rem;color:var(--slate)}

.menu-btn{display:none;position:fixed;top:1rem;left:1rem;z-index:150;background:var(--gold2);color:var(--navy);border:none;padding:.55rem .85rem;font-family:var(--mono);font-size:.64rem;cursor:pointer}
@media(max-width:1000px){
  .sidebar{transform:translateX(-100%);transition:transform .3s}
  .sidebar.open{transform:none}
  .main{margin-left:0;padding:4rem 1.3rem 7rem}
  .ask{width:100%;padding:.8rem 1.3rem}
  .answer{right:1rem;width:calc(100% - 2rem)}
  .menu-btn{display:block}
}
@media print{
  @page{margin:16mm}
  body{background:#fff;color:#222}
  .sidebar,.ask,.answer,.pbar,.menu-btn,.toc{display:none!important}
  .main{margin:0;padding:0;max-width:none}
  .stage{display:block!important;page-break-after:always}
  .sec{border:none;background:none;page-break-inside:avoid}
  .sec>summary{padding:0;border:none}
  .sec .sec-body{display:block!important;padding:0;border:none}
  .sec-i,.expand-all,.jump{display:none!important}
  .sec-t{color:#0D1B2A;font-size:1.3rem}
  .stage:last-child{page-break-after:auto}
  .stage-title,.output h1,.output h2,.output h3{color:#0D1B2A;page-break-after:avoid}
  .output th{color:#8a6418;border-bottom:1px solid #C9922A}
  .output td{color:#333;border-bottom:1px solid #ddd}
  table{page-break-inside:avoid}
  .output p{color:#333}
}

.mv{border:1px solid var(--bdim);background:var(--navy2);padding:1.6rem;margin:1.4rem 0}
.mv-head{font-family:var(--mono);font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold2);margin-bottom:1.2rem}
.mv-hl{font-family:var(--serif);font-size:1.2rem;font-style:italic;color:var(--gold2);line-height:1.4;margin-bottom:1.4rem}

/* boxes */
.mv-box{background:var(--navy3);border:1px solid var(--bdim);padding:.9rem 1rem;min-height:96px;display:flex;flex-direction:column}
.mv-bt{font-family:var(--mono);font-size:.55rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold);margin-bottom:.6rem;line-height:1.3}
.mv-bi{font-size:.78rem;line-height:1.5;color:var(--mist);margin-bottom:.3rem;padding-left:.7rem;position:relative}
.mv-bi::before{content:'—';position:absolute;left:0;color:var(--gold);opacity:.55}
.mv-bn{font-size:.72rem;color:var(--slate);margin-top:auto;padding-top:.6rem;font-style:italic;line-height:1.45}

/* generic grid */
.mv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:6px}

/* business model canvas */
.mv-bmc{display:grid;gap:6px;grid-template-columns:repeat(5,1fr);grid-template-rows:auto auto}
.mv-bmc .c1{grid-column:1;grid-row:1/3}
.mv-bmc .c2{grid-column:2;grid-row:1}
.mv-bmc .c3{grid-column:2;grid-row:2}
.mv-bmc .c4{grid-column:3;grid-row:1/3}
.mv-bmc .c5{grid-column:4;grid-row:1}
.mv-bmc .c6{grid-column:4;grid-row:2}
.mv-bmc .c7{grid-column:5;grid-row:1/3}
.mv-bmc .c8{grid-column:1/4;grid-row:3}
.mv-bmc .c9{grid-column:4/6;grid-row:3}
@media(max-width:900px){.mv-bmc{grid-template-columns:1fr}.mv-bmc>div{grid-column:1!important;grid-row:auto!important}}

/* 2x2 matrix */
.mv-mx{position:relative;padding:0 0 34px 34px}
.mv-mxg{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:2px;background:var(--bdim);aspect-ratio:1.35}
.mv-q{background:var(--navy3);padding:.85rem;position:relative;overflow:hidden}
.mv-ql{font-family:var(--mono);font-size:.53rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);opacity:.8}
.mv-dot{position:absolute;transform:translate(-50%,50%)}
.mv-dot i{display:block;width:9px;height:9px;background:var(--gold2);border-radius:50%;margin:0 auto 3px}
.mv-dot span{font-size:.68rem;color:var(--cream);white-space:nowrap;background:rgba(13,27,42,.82);padding:1px 5px}
.mv-ax{position:absolute;font-family:var(--mono);font-size:.55rem;letter-spacing:.1em;text-transform:uppercase;color:var(--slate)}
.mv-ax.x{bottom:8px;left:34px;right:0;text-align:center}
.mv-ax.y{left:0;top:0;bottom:34px;writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}

/* forces */
.mv-forces{display:grid;gap:6px}
.mv-force{display:grid;grid-template-columns:180px 1fr 90px;gap:1rem;align-items:center;background:var(--navy3);padding:.75rem 1rem;border:1px solid var(--bdim)}
.mv-fl{font-size:.85rem;color:var(--white)}
.mv-fn{font-size:.76rem;color:var(--mist);line-height:1.5}
.mv-fr{font-family:var(--mono);font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;text-align:right}
.mv-centre{text-align:center;font-family:var(--serif);font-size:1.15rem;color:var(--gold2);padding:.8rem;border:1px solid var(--border);margin-bottom:6px}

/* scored */
.mv-sc{display:grid;gap:.55rem}
.mv-srow{display:grid;grid-template-columns:200px 1fr 66px;gap:1rem;align-items:center;font-size:.8rem}
.mv-strack{height:20px;background:rgba(184,196,208,.08);position:relative}
.mv-sfill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));position:absolute;left:0;top:0}
.mv-starget{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--gold3);opacity:.85}
.mv-sv{font-family:var(--mono);font-size:.74rem;text-align:right;color:var(--mist)}
.mv-note{font-size:.74rem;color:var(--slate);margin-top:.9rem;line-height:1.6}

/* ladder */
.mv-lad{display:grid;gap:2px;background:var(--bdim)}
.mv-step{background:var(--navy3);padding:.9rem 1.1rem;display:grid;grid-template-columns:34px 1fr auto;gap:1rem;align-items:baseline}
.mv-sn{font-family:var(--mono);font-size:.62rem;color:var(--gold)}
.mv-sl{font-size:.88rem;color:var(--white)}
.mv-sd{font-size:.76rem;color:var(--mist);line-height:1.55;grid-column:2}
.mv-sval{font-family:var(--serif);font-size:1.1rem;color:var(--gold2)}

/* table */
.mv-tbl{width:100%;border-collapse:collapse;font-size:.82rem}
.mv-tbl th{font-family:var(--mono);font-size:.55rem;letter-spacing:.13em;text-transform:uppercase;color:var(--gold2);text-align:left;padding:.65rem .8rem;border-bottom:1px solid var(--border)}
.mv-tbl td{padding:.65rem .8rem;border-bottom:1px solid var(--bdim);color:var(--mist);vertical-align:top}

.mv-conf{font-size:.74rem;color:var(--slate);margin-top:1.2rem;padding-top:.9rem;border-top:1px solid var(--bdim);line-height:1.6}
@media print{.mv{break-inside:avoid}.mv-box{background:#f6f4f0;border:1px solid #ddd}.mv-bt{color:#8a6418}.mv-bi,.mv-fn,.mv-sd{color:#333}}

</style>

<script>
const API='/.netlify/functions';
let DATA=null, CUR=-1;
const el=id=>document.getElementById(id);

function md(t){
  const esc=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const lines=esc.split('\n');
  let out='',inUl=false,inTable=false;
  const closeUl=()=>{if(inUl){out+='</ul>';inUl=false;}};
  const closeTable=()=>{if(inTable){out+='</tbody></table>';inTable=false;}};
  for(let ln of lines){
    ln=ln.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    if(/^\s*\|.*\|\s*$/.test(ln)){
      if(/^[\s|:-]+$/.test(ln)) continue;
      const cells=ln.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      if(!inTable){closeUl();out+='<table><thead><tr>'+cells.map(c=>'<th>'+c+'</th>').join('')+'</tr></thead><tbody>';inTable=true;}
      else out+='<tr>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>';
      continue;
    }
    closeTable();
    const h=ln.match(/^(#{1,4})\s+(.*)$/);
    if(h){closeUl();const l=Math.min(h[1].length+1,4);out+='<h'+l+'>'+h[2]+'</h'+l+'>';continue;}
    const li=ln.match(/^\s*[-*•]\s+(.*)$/);
    if(li){if(!inUl){out+='<ul>';inUl=true;}out+='<li>'+li[1]+'</li>';continue;}
    closeUl();
    if(/^\s*---+\s*$/.test(ln)){out+='<hr>';continue;}
    if(ln.trim()==='')continue;
    out+='<p>'+ln+'</p>';
  }
  closeUl();closeTable();
  return out;
}

function esc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function drawChart(ch){
  const series=(ch.series||[]).filter(x=>typeof x.value==='number');
  if(!series.length) return '';
  let inner='';
  if(ch.type==='donut' && series.length>=2){
    const total=series.reduce((a,b)=>a+b.value,0)||1;
    const pct=Math.round(series[0].value/total*100);
    inner='<div style="display:flex;align-items:center;gap:1.6rem">'+
      '<svg width="118" height="118" viewBox="0 0 42 42"><circle cx="21" cy="21" r="16" fill="none" stroke="rgba(184,196,208,.14)" stroke-width="7"/>'+
      '<circle cx="21" cy="21" r="16" fill="none" stroke="'+(pct>60?'#E07A5F':'var(--gold2)')+'" stroke-width="7" pathLength="100" stroke-dasharray="'+pct+' 100" transform="rotate(-90 21 21)"/></svg>'+
      '<div><div style="font-family:var(--serif);font-size:2.2rem;color:'+(pct>60?'#E07A5F':'var(--gold2)')+';line-height:1">'+pct+'%</div>'+
      '<div class="mlab">'+esc(series[0].label)+'</div></div></div>';
  } else {
    const max=Math.max(...series.map(x=>x.value))||1;
    inner=series.map(x=>'<div class="brow"><span>'+esc(x.label)+'</span>'+
      '<div class="btrack"><div class="bfill'+(x.highlight?' hi':'')+'" style="width:'+Math.max(2,x.value/max*100)+'%"></div></div>'+
      '<span class="bval">'+esc(x.display||x.value)+'</span></div>').join('');
  }
  return '<div class="chart"><div class="ctitle">'+esc(ch.title)+'</div>'+inner+
    (ch.note?'<div class="cnote">'+esc(ch.note)+'</div>':'')+'</div>';
}

function drawSpider(sc){
  const dims=(sc.dimensions||[]).filter(d=>typeof d.current==='number');
  if(dims.length<3) return '';
  const R=105,cx=125,cy=125,n=dims.length;
  const pt=(i,v)=>{const a=(Math.PI*2*i/n)-Math.PI/2;const r=R*(v/5);return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  const poly=v=>dims.map((d,i)=>pt(i,v(d)).join(',')).join(' ');
  let rings='';
  [1,2,3,4,5].forEach(l=>{ rings+='<polygon points="'+dims.map((d,i)=>pt(i,l).join(',')).join(' ')+'" fill="none" stroke="rgba(184,196,208,.12)" stroke-width="1"/>'; });
  let spokes=dims.map((d,i)=>{const[x,y]=pt(i,5);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+x+'" y2="'+y+'" stroke="rgba(184,196,208,.12)"/>';}).join('');
  let labels=dims.map((d,i)=>{const[x,y]=pt(i,6.05);
    const anchor=x<cx-8?'end':x>cx+8?'start':'middle';
    return '<text x="'+x+'" y="'+(y+3)+'" text-anchor="'+anchor+'" font-family="DM Mono, monospace" font-size="7" fill="#6B7F92">'+esc(d.label).slice(0,22)+'</text>';}).join('');
  return '<div class="chart wide"><div class="ctitle">Operating model — current against target</div>'+
    '<div class="spider-wrap"><svg width="330" height="250" viewBox="0 0 250 250">'+rings+spokes+
    '<polygon points="'+poly(d=>d.target||5)+'" fill="rgba(232,180,84,.07)" stroke="rgba(232,180,84,.45)" stroke-width="1.5" stroke-dasharray="4 3"/>'+
    '<polygon points="'+poly(d=>d.current)+'" fill="rgba(201,146,42,.22)" stroke="#E8B454" stroke-width="2"/>'+
    labels+'</svg>'+
    '<div style="flex:1;min-width:220px">'+(sc.note?'<p style="font-size:.85rem;line-height:1.7">'+esc(sc.note)+'</p>':'')+
    '<div class="legend"><span><i style="background:#E8B454"></i>Current</span><span><i style="background:rgba(232,180,84,.35)"></i>Target</span></div>'+
    '<div style="margin-top:1.2rem">'+dims.map(d=>
      '<div class="brow" style="grid-template-columns:1fr 100px 42px"><span style="font-size:.76rem">'+esc(d.label)+'</span>'+
      '<div class="btrack"><div class="bfill hi" style="width:'+(d.current/5*100)+'%"></div></div>'+
      '<span class="bval">'+d.current+'/5</span></div>').join('')+'</div></div></div></div>';
}

function drawTrajectory(tr){
  const pts=(tr.points||[]).filter(p=>typeof p.base==='number');
  if(pts.length<2) return '';
  const W=560,H=210,pad=34;
  const vals=pts.flatMap(p=>[p.base, typeof p.target==='number'?p.target:p.base]);
  const max=Math.max(...vals)*1.08, min=Math.min(...vals)*0.9;
  const X=i=>pad+(i*(W-pad*2)/(pts.length-1));
  const Y=v=>H-pad-((v-min)/(max-min||1))*(H-pad*2);
  const line=(k)=>pts.map((p,i)=>(i?'L':'M')+X(i)+' '+Y(typeof p[k]==='number'?p[k]:p.base)).join(' ');
  const dots=(k,col)=>pts.map((p,i)=>'<circle cx="'+X(i)+'" cy="'+Y(typeof p[k]==='number'?p[k]:p.base)+'" r="3.5" fill="'+col+'"/>').join('');
  const labels=pts.map((p,i)=>'<text x="'+X(i)+'" y="'+(H-12)+'" text-anchor="middle" font-family="DM Mono, monospace" font-size="8" fill="#6B7F92">'+esc(p.label)+'</text>').join('');
  const last=pts[pts.length-1];
  return '<div class="chart wide"><div class="ctitle">'+esc(tr.title||'Trajectory')+'</div>'+
    '<svg width="100%" height="'+H+'" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+
    '<path d="'+line('base')+'" fill="none" stroke="rgba(184,196,208,.4)" stroke-width="2" stroke-dasharray="5 4"/>'+
    '<path d="'+line('target')+'" fill="none" stroke="#E8B454" stroke-width="2.5"/>'+
    dots('base','rgba(184,196,208,.5)')+dots('target','#E8B454')+labels+
    '<text x="'+(X(pts.length-1)-4)+'" y="'+(Y(last.target||last.base)-11)+'" text-anchor="end" font-family="Cormorant Garamond, serif" font-size="15" fill="#E8B454">'+esc((tr.unit||'')+(last.target||last.base))+'</text>'+
    '</svg><div class="legend"><span><i style="background:#E8B454"></i>With transformation</span><span><i style="background:rgba(184,196,208,.4)"></i>Current model</span></div>'+
    (tr.note?'<div class="cnote">'+esc(tr.note)+'</div>':'')+'</div>';
}

/* ── SCENARIO MODELLER ── */
let MODEL=null;
function drawModeller(m){
  if(!m || !Array.isArray(m.streams) || !m.streams.length) return '';
  MODEL=m;
  const cur=m.currency||'£';
  return '<div class="mod"><div class="ctitle">Scenario modeller — test a decision before you make it</div>'+
    '<div class="presets" id="presets">'+
      '<button class="pset on" onclick="preset(this,\'base\')">Baseline</button>'+
      '<button class="pset" onclick="preset(this,\'lose\')">Lose at-risk revenue</button>'+
      '<button class="pset" onclick="preset(this,\'half\')">At-risk revenue halved</button>'+
      '<button class="pset" onclick="preset(this,\'plan\')">Transformation delivers</button>'+
    '</div>'+
    '<div class="mod-grid"><div id="modControls">'+
      m.streams.map((st,i)=>
        '<div class="ctrl"><div class="ctrl-l"><span>'+esc(st.label)+(st.atRisk?' · at risk':'')+'</span><span class="ctrl-v" id="lv'+i+'">100%</span></div>'+
        '<input type="range" id="sv'+i+'" min="0" max="100" value="100" oninput="recalc()"></div>').join('')+
      '<div class="ctrl"><div class="ctrl-l"><span>New revenue added</span><span class="ctrl-v" id="lvNew">'+cur+'0</span></div>'+
      '<input type="range" id="svNew" min="0" max="100" value="0" oninput="recalc()"></div>'+
      '<div class="ctrl"><div class="ctrl-l"><span>Cost removed on lost revenue</span><span class="ctrl-v" id="lvCost">60%</span></div>'+
      '<input type="range" id="svCost" min="0" max="100" value="60" oninput="recalc()"></div>'+
    '</div><div><div class="kpis" id="modKpis"></div><div class="verdict" id="modVerdict"></div>'+
    (m.note?'<p class="cnote">'+esc(m.note)+'</p>':'')+'</div></div></div>';
}

function fmtM(v,c){ return (v<0?'-':'')+c+Math.abs(v/1e6).toFixed(2)+'m'; }
function fmtK(v,c){ return (v<0?'-':'')+c+Math.abs(Math.round(v/1000)).toLocaleString()+'k'; }

function preset(btn,kind){
  document.querySelectorAll('.pset').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  MODEL.streams.forEach((st,i)=>{
    const el=document.getElementById('sv'+i);
    if(kind==='lose') el.value = st.atRisk?0:100;
    else if(kind==='half') el.value = st.atRisk?50:100;
    else el.value=100;
  });
  document.getElementById('svNew').value = kind==='plan'?40:0;
  document.getElementById('svCost').value = 60;
  recalc();
}

function recalc(){
  const m=MODEL, cur=m.currency||'£';
  const baseTotal=m.streams.reduce((a,s)=>a+s.value,0);
  const newMax=Math.max(baseTotal*0.4, 1);
  const newPct=+document.getElementById('svNew').value/100;
  const newRev=newMax*newPct;
  const costFlex=+document.getElementById('svCost').value/100;

  document.getElementById('lvNew').textContent=fmtM(newRev,cur);
  document.getElementById('lvCost').textContent=document.getElementById('svCost').value+'%';

  let rev=0, contrib=0, lost=0;
  m.streams.forEach((s,i)=>{
    const p=+document.getElementById('sv'+i).value/100;
    document.getElementById('lv'+i).textContent=Math.round(p*100)+'%';
    rev+=s.value*p; contrib+=s.value*p*(s.margin||0.15); lost+=s.value*(1-p);
  });
  rev+=newRev; contrib+=newRev*0.3;

  const fixed=(m.fixed_costs||0)-((m.fixed_costs||0)*(lost/(baseTotal||1))*costFlex);
  const surplus=contrib-fixed-(m.finance_costs||0);
  const cash=m.cash||0;
  const runway=surplus>=0?null:Math.max(0,cash/(Math.abs(surplus)/52));
  const riskRev=m.streams.filter(s=>s.atRisk).reduce((a,s,i)=>a+s.value*(+document.getElementById('sv'+m.streams.indexOf(s)).value/100),0);
  const conc=rev>0?riskRev/rev*100:0;
  const hcRisk=m.headcount?Math.round(m.headcount*(lost/(baseTotal||1))*costFlex):null;

  document.getElementById('modKpis').innerHTML=
    '<div class="kpi"><div class="kv">'+fmtM(rev,cur)+'</div><div class="kl">Revenue</div><div class="kd">'+(rev>=baseTotal?'+':'')+fmtK(rev-baseTotal,cur)+'</div></div>'+
    '<div class="kpi"><div class="kv '+(surplus<0?'bad':'good')+'">'+fmtK(surplus,cur)+'</div><div class="kl">Operating surplus</div></div>'+
    (cash?'<div class="kpi"><div class="kv '+(runway!==null&&runway<8?'bad':'')+'">'+(runway===null?'Surplus':(runway>=52?'52+ wks':Math.round(runway)+' wks'))+'</div><div class="kl">Cash runway</div></div>':'')+
    '<div class="kpi"><div class="kv '+(conc>60?'bad':conc<40?'good':'')+'">'+conc.toFixed(0)+'%</div><div class="kl">At-risk concentration</div></div>'+
    (hcRisk!==null?'<div class="kpi"><div class="kv '+(hcRisk>m.headcount*0.2?'bad':'')+'">'+hcRisk+'</div><div class="kl">Roles exposed</div><div class="kd">of '+m.headcount+'</div></div>':'')+
    (m.target_revenue?'<div class="kpi"><div class="kv">'+fmtM(Math.max(0,m.target_revenue-rev),cur)+'</div><div class="kl">Gap to target</div><div class="kd">'+esc(m.target_label||'')+'</div></div>':'');

  let v;
  if(surplus>=0 && rev>=baseTotal) v='The organisation holds its position'+(newRev>0?', and '+fmtM(newRev,cur)+' of new revenue reduces at-risk concentration to '+conc.toFixed(0)+'% — the structural measure that matters more than the revenue line.':'. This is the current model continuing unchanged.');
  else if(runway!==null && runway<8) v='This scenario is not survivable on current terms. An operating deficit of '+fmtK(Math.abs(surplus),cur)+' against '+fmtK(cash,cur)+' of cash leaves roughly '+Math.round(runway)+' weeks of cover, and finance costs continue regardless.';
  else if(surplus<0) v='The organisation moves into deficit of '+fmtK(Math.abs(surplus),cur)+'.'+(runway!==null?' Cash cover of roughly '+Math.round(runway)+' weeks buys time to act, not time to deliberate.':'')+(hcRisk?' '+hcRisk+' roles sit against the lost income.':'');
  else v='The organisation stays in surplus at '+fmtK(surplus,cur)+', but revenue falls '+fmtK(Math.abs(rev-baseTotal),cur)+' below baseline. At-risk concentration of '+conc.toFixed(0)+'% remains the structural exposure.';
  document.getElementById('modVerdict').textContent=v;
}

function groupSections(html, stageNum){
  // Split the rendered stage into collapsible sections at each heading.
  // Headline finding stays visible; the working sits behind a click.
  const parts = html.split(/(?=<h[23]>)/);
  if(parts.length < 3) return html;

  let out = '<button class="expand-all" onclick="toggleAll('+stageNum+',this)">Expand all</button>';
  let lead = '';
  let i = 0;

  if(!/^<h[23]>/.test(parts[0])){ lead = parts[0]; i = 1; }
  if(lead.trim()) out += lead;

  for(; i < parts.length; i++){
    const m = parts[i].match(/^<h([23])>(.*?)<\/h\1>/);
    if(!m){ out += parts[i]; continue; }
    const title = m[2].replace(/<[^>]+>/g,'').trim();
    const body = parts[i].slice(m[0].length);
    out += '<details class="sec"><summary><span class="sec-t">'+title+'</span><span class="sec-i">+</span></summary>'+
           '<div class="sec-body">'+body+'</div></details>';
  }
  return out;
}

function toggleAll(n, btn){
  const sec = document.getElementById('st'+n);
  if(!sec) return;
  const items = sec.querySelectorAll('details.sec');
  const open = btn.textContent.trim() === 'Expand all';
  items.forEach(d => d.open = open);
  btn.textContent = open ? 'Collapse all' : 'Expand all';
}

function jumpNav(html, n){
  const re=/<h([23])>(.*?)<\/h\1>/g; let m, items=[], i=0;
  while((m=re.exec(html))!==null){
    const txt=m[2].replace(/<[^>]+>/g,'').trim();
    if(txt.length>1 && txt.length<70) items.push({txt, id:'s'+n+'h'+(i++)});
  }
  if(items.length<3) return '';
  return '<div class="jump">'+items.slice(0,14).map((it,ix)=>
    '<a onclick="jumpTo('+n+','+ix+')">'+esc(it.txt)+'</a>').join('')+'</div>';
}

function jumpTo(stage,index){
  const sec=document.getElementById('st'+stage);
  if(!sec) return;
  const hs=sec.querySelectorAll('.output h2, .output h3');
  const valid=[...hs].filter(h=>{const t=h.textContent.trim();return t.length>1&&t.length<70;});
  if(valid[index]) valid[index].scrollIntoView({behavior:'smooth',block:'start'});
}

function mvEsc(t){ return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function mvBox(cell, cls){
  const items = (cell.items||[]).map(i=>'<div class="mv-bi">'+mvEsc(i)+'</div>').join('');
  return '<div class="mv-box '+(cls||'')+'"><div class="mv-bt">'+mvEsc(cell.label)+'</div>'+items+
    (cell.note?'<div class="mv-bn">'+mvEsc(cell.note)+'</div>':'')+'</div>';
}

function mvGrid(p, key){
  const cells = p.cells||[];
  if(!cells.length) return '';
  // Business Model Canvas and Lean Canvas use the canonical nine-box layout
  if((key==='bmc'||key==='lean_canvas') && cells.length>=9){
    return '<div class="mv-bmc">'+cells.slice(0,9).map((c,i)=>mvBox(c,'c'+(i+1))).join('')+'</div>';
  }
  return '<div class="mv-grid">'+cells.map(c=>mvBox(c)).join('')+'</div>';
}

function mvMatrix(p){
  const ax = p.axes||{x:{},y:{}};
  const items = p.items||[];
  const quads = [
    {x:0,y:1},{x:1,y:1},
    {x:0,y:0},{x:1,y:0}
  ];
  // derive quadrant labels from items where given
  const qLabels = ['','','',''];
  items.forEach(it=>{
    const qi = (it.y>=0.5?0:2) + (it.x>=0.5?1:0);
    if(it.quadrant && !qLabels[qi]) qLabels[qi]=it.quadrant;
  });

  const dots = items.map(it=>{
    const left = Math.max(3,Math.min(97,(it.x??0.5)*100));
    const bottom = Math.max(3,Math.min(97,(it.y??0.5)*100));
    return '<div class="mv-dot" style="left:'+left+'%;bottom:'+bottom+'%" title="'+mvEsc(it.note||'')+'">'+
      '<i></i><span>'+mvEsc(it.label)+'</span></div>';
  }).join('');

  return '<div class="mv-mx">'+
    '<div style="position:relative">'+
    '<div class="mv-mxg">'+quads.map((q,i)=>'<div class="mv-q"><span class="mv-ql">'+mvEsc(qLabels[i]||'')+'</span></div>').join('')+'</div>'+
    '<div style="position:absolute;inset:0;pointer-events:none">'+dots+'</div>'+
    '</div>'+
    '<div class="mv-ax x">'+mvEsc(ax.x?.label||'')+(ax.x?.low?' · '+mvEsc(ax.x.low)+' → '+mvEsc(ax.x.high||''):'')+'</div>'+
    '<div class="mv-ax y">'+mvEsc(ax.y?.label||'')+(ax.y?.low?' · '+mvEsc(ax.y.low)+' → '+mvEsc(ax.y.high||''):'')+'</div>'+
    '</div>';
}

function mvForces(p){
  const cols = {'very high':'#E07A5F','high':'#E8B454','moderate':'#B8C4D0','low':'#7FB069'};
  return (p.centre?'<div class="mv-centre">'+mvEsc(p.centre)+'</div>':'')+
    '<div class="mv-forces">'+(p.forces||[]).map(f=>{
      const c = cols[(f.rating||'').toLowerCase()] || 'var(--gold2)';
      const w = ((f.score||3)/5)*100;
      return '<div class="mv-force"><div><div class="mv-fl">'+mvEsc(f.label)+'</div>'+
        '<div class="mv-strack" style="margin-top:.45rem;height:5px"><div class="mv-sfill" style="width:'+w+'%;background:'+c+'"></div></div></div>'+
        '<div class="mv-fn">'+mvEsc(f.note)+'</div>'+
        '<div class="mv-fr" style="color:'+c+'">'+mvEsc(f.rating||'')+'</div></div>';
    }).join('')+'</div>';
}

function mvSpider(items){
  const d = items.filter(i=>typeof i.score==='number');
  if(d.length<5) return '';
  const R=100,cx=125,cy=125,n=d.length,max=d[0].max||5;
  const pt=(i,v)=>{const a=(Math.PI*2*i/n)-Math.PI/2;const r=R*(v/max);return [cx+r*Math.cos(a),cy+r*Math.sin(a)];};
  let rings='';
  for(let l=1;l<=max;l++) rings+='<polygon points="'+d.map((x,i)=>pt(i,l).join(',')).join(' ')+'" fill="none" stroke="rgba(184,196,208,.11)"/>';
  const spokes=d.map((x,i)=>{const[a,b]=pt(i,max);return '<line x1="'+cx+'" y1="'+cy+'" x2="'+a+'" y2="'+b+'" stroke="rgba(184,196,208,.11)"/>';}).join('');
  const labels=d.map((x,i)=>{const[a,b]=pt(i,max*1.16);
    const anc=a<cx-8?'end':a>cx+8?'start':'middle';
    return '<text x="'+a+'" y="'+(b+3)+'" text-anchor="'+anc+'" font-family="DM Mono,monospace" font-size="7" fill="#6B7F92">'+mvEsc(x.label).slice(0,20)+'</text>';}).join('');
  const tgt=d.some(x=>typeof x.target==='number')
    ? '<polygon points="'+d.map((x,i)=>pt(i,x.target||max).join(',')).join(' ')+'" fill="rgba(232,180,84,.06)" stroke="rgba(232,180,84,.4)" stroke-dasharray="4 3"/>' : '';
  return '<svg width="290" height="255" viewBox="0 0 250 250" style="flex-shrink:0">'+rings+spokes+tgt+
    '<polygon points="'+d.map((x,i)=>pt(i,x.score).join(',')).join(' ')+'" fill="rgba(201,146,42,.22)" stroke="#E8B454" stroke-width="2"/>'+labels+'</svg>';
}

function mvScored(p){
  const items = p.items||[];
  const bars = '<div class="mv-sc">'+items.map(i=>{
    const max = i.max||5;
    const w = typeof i.score==='number' ? (i.score/max)*100 : 0;
    const t = typeof i.target==='number' ? (i.target/max)*100 : null;
    return '<div><div class="mv-srow"><span style="color:var(--white)">'+mvEsc(i.label)+'</span>'+
      '<div class="mv-strack"><div class="mv-sfill" style="width:'+w+'%"></div>'+
      (t!==null?'<div class="mv-starget" style="left:'+t+'%"></div>':'')+'</div>'+
      '<span class="mv-sv">'+(typeof i.score==='number'?i.score+'/'+max:'—')+'</span></div>'+
      (i.note?'<div style="font-size:.74rem;color:var(--slate);margin:.25rem 0 .5rem;line-height:1.5">'+mvEsc(i.note)+'</div>':'')+
      '</div>';
  }).join('')+'</div>';
  const spider = mvSpider(items);
  return spider
    ? '<div style="display:flex;gap:2rem;align-items:flex-start;flex-wrap:wrap">'+spider+'<div style="flex:1;min-width:280px">'+bars+'</div></div>'
    : bars;
}

function mvQuadrants(p){
  const q = p.quadrants||[];
  return '<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">'+q.map(c=>mvBox(c)).join('')+'</div>';
}

function mvTable(p){
  const h = p.headers||[];
  const r = p.rows||[];
  if(!h.length) return '';
  return '<div style="overflow-x:auto"><table class="mv-tbl"><thead><tr>'+h.map(x=>'<th>'+mvEsc(x)+'</th>').join('')+
    '</tr></thead><tbody>'+r.map(row=>'<tr>'+row.map(c=>'<td>'+mvEsc(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}

function mvLadder(p){
  return '<div class="mv-lad">'+(p.steps||[]).map((s,i)=>
    '<div class="mv-step"><span class="mv-sn">'+String(i+1).padStart(2,'0')+'</span>'+
    '<span class="mv-sl">'+mvEsc(s.label)+'</span>'+
    (s.value?'<span class="mv-sval">'+mvEsc(s.value)+'</span>':'<span></span>')+
    (s.note?'<div class="mv-sd">'+mvEsc(s.note)+'</div>':'')+'</div>').join('')+'</div>';
}

function renderModelVisual(m){
  const p = m.payload || {};
  const type = m.render_type;
  let body = '';
  if(type==='grid')           body = mvGrid(p, m.model_key);
  else if(type==='matrix')    body = mvMatrix(p);
  else if(type==='forces')    body = mvForces(p);
  else if(type==='scored')    body = mvScored(p);
  else if(type==='quadrants') body = mvQuadrants(p);
  else if(type==='table')     body = mvTable(p);
  else if(type==='ladder')    body = mvLadder(p);

  // Fallback: if the payload came back in a different shape to the one
  // declared, render whatever structure it does contain rather than
  // dropping to prose. Every model gets a visual.
  if(!body){
    if(Array.isArray(p.cells) && p.cells.length)          body = mvGrid(p, m.model_key);
    else if(Array.isArray(p.quadrants) && p.quadrants.length) body = mvQuadrants(p);
    else if(Array.isArray(p.items) && p.items.length && typeof p.items[0].score==='number') body = mvScored(p);
    else if(Array.isArray(p.items) && p.items.length)     body = mvMatrix(p);
    else if(Array.isArray(p.forces) && p.forces.length)   body = mvForces(p);
    else if(Array.isArray(p.steps) && p.steps.length)     body = mvLadder(p);
    else if(Array.isArray(p.headers) && p.headers.length) body = mvTable(p);
  }
  if(!body) body = '<div class="mv-note">This model returned no structured output. Re-run it to rebuild the visual.</div>';

  return '<div class="mv"><div class="mv-head">'+mvEsc(m.model_name)+'</div>'+
    (p.headline?'<div class="mv-hl">'+mvEsc(p.headline)+'</div>':'')+
    body +
    (p.confidence?'<div class="mv-conf">'+mvEsc(p.confidence)+'</div>':'')+
    '</div>';
}


async function openPortal(){
  const code=el('gcode').value.trim().toUpperCase();
  const err=el('gerr');
  if(!code){err.textContent='Enter your access code.';return;}
  err.textContent='Opening…';
  try{
    const r=await fetch(API+'/get-portal?code='+encodeURIComponent(code));
    const d=await r.json();
    if(!r.ok){err.textContent=d.error||'Could not open portal';return;}
    DATA=d;
    try{
      const mr = await fetch(API+'/get-models?code='+encodeURIComponent(code));
      const md2 = await mr.json();
      DATA.models = (md2.models||[]).filter(m=>m.status==='complete');
    }catch(e){ DATA.models = []; }
    sessionStorage.setItem('tos_portal_code',code);
    el('gate').classList.add('hidden');
    el('sidebar').style.display='';
    el('main').style.display='';
    el('askbar').style.display='';
    render();
  }catch(e){err.textContent='Could not reach the portal. Please try again.';}
}

function render(){
  const c=DATA.company;
  el('cName').textContent=c.company_name||'';
  el('cMeta').textContent='Enterprise Transformation'+(c.sector?' · '+c.sector:'');
  el('nav').innerHTML=DATA.stages.map(s=>
    '<a class="sb-link" onclick="go('+s.stage_number+')"><span class="sb-num">'+
    String(s.stage_number).padStart(2,'0')+'</span><span>'+s.stage_name+'</span></a>').join('');

  const sum = c.summary;

  let html='<section class="stage on" id="st-1">'+
    '<div class="eyebrow">Enterprise Transformation · Confidential</div>'+
    '<h1 class="doc">'+(c.company_name||'Your organisation')+'</h1>'+
    '<div class="hero-line"></div>';

  if(sum && sum.headline) html += '<div class="headline">'+esc(sum.headline)+'</div>';

  if(sum && Array.isArray(sum.metrics) && sum.metrics.length){
    html += '<div class="mgrid">'+sum.metrics.map(m=>
      '<div class="mcard"><div class="mval '+(m.tone==='bad'?'bad':m.tone==='good'?'good':'')+'">'+esc(m.value)+'</div>'+
      '<div class="mlab">'+esc(m.label)+'</div>'+(m.note?'<div class="mnote">'+esc(m.note)+'</div>':'')+'</div>').join('')+'</div>';
  }

  if(sum && sum.narrative){
    html += '<div class="output">'+md(sum.narrative)+'</div>';
  } else {
    html += '<p class="lede">Your complete transformation. '+DATA.stages.length+' stages, each building on the one before it.</p>';
  }

  const vis=[];
  if(sum && Array.isArray(sum.charts)) sum.charts.forEach(c=>vis.push(drawChart(c)));
  if(sum && sum.trajectory) vis.push(drawTrajectory(sum.trajectory));
  if(sum && sum.scores) vis.push(drawSpider(sum.scores));
  if(vis.filter(Boolean).length) html += '<div class="cgrid">'+vis.join('')+'</div>';

  if(sum && sum.model) html += drawModeller(sum.model);

  if(sum && Array.isArray(sum.findings) && sum.findings.length){
    html += '<div class="eyebrow" style="margin-top:3rem">What we found</div>';
    html += '<div class="fgrid">'+sum.findings.map((f,i)=>
      '<div class="fcard" onclick="go('+(f.stage||1)+')">'+
      '<div class="fnum">Finding '+String(i+1).padStart(2,'0')+'</div>'+
      '<div class="ftitle">'+esc(f.title)+'</div>'+
      '<div class="fdetail">'+esc(f.detail)+'</div>'+
      '<span class="flink">Stage '+String(f.stage||1).padStart(2,'0')+' &rarr;</span></div>').join('')+'</div>';
  }

  html += '<div class="eyebrow" style="margin-top:3rem">The stages</div>'+
    '<div class="toc">'+DATA.stages.map(st=>
      '<a onclick="go('+st.stage_number+')"><span class="n">'+String(st.stage_number).padStart(2,'0')+'</span><span>'+st.stage_name+'</span></a>').join('')+'</div>'+
    '<div class="confid">Prepared by <span class="tname">Transform</span><span class="tos">OS</span>'+
    (c.prepared? ' · '+new Date(c.prepared).toLocaleDateString('en-GB',{month:'long',year:'numeric'}) : '')+' · Client confidential</div>'+
    '</section>';

  html+=DATA.stages.map(st=>{
    const meta = sum && Array.isArray(sum.stages) ? sum.stages.find(x=>x.stage_number===st.stage_number) : null;
    const bodyHtml = md(st.output_content||'');
    return '<section class="stage" id="st'+st.stage_number+'">'+
      '<div class="stage-head">Stage '+String(st.stage_number).padStart(2,'0')+'</div>'+
      '<div class="stage-title">'+st.stage_name+'</div>'+
      (meta ? '<div class="ssum">'+
        (meta.headline?'<div class="ssum-h">'+esc(meta.headline)+'</div>':'')+
        (meta.summary?'<div class="ssum-p">'+esc(meta.summary)+'</div>':'')+
        (Array.isArray(meta.metrics)&&meta.metrics.length?'<div class="ssum-m">'+meta.metrics.map(m=>
          '<div><span class="ssum-mv">'+esc(m.value)+'</span><span class="ssum-ml">'+esc(m.label)+'</span></div>').join('')+'</div>':'')+
        '</div>' : '')+
      jumpNav(bodyHtml, st.stage_number)+
      '<div class="output">'+groupSections(bodyHtml, st.stage_number)+'</div></section>';
  }).join('');

  if(DATA.models && DATA.models.length){
    el('modelsNav').innerHTML='<div class="sb-sec">Models</div>'+
      '<a class="sb-link" onclick="go(-9)"><span class="sb-num">&#9633;</span><span>'+DATA.models.length+' frameworks applied</span></a>';
    html += '<section class="stage" id="st-9">'+
      '<div class="stage-head">Models Master</div>'+
      '<div class="stage-title">Frameworks applied</div>'+
      '<p class="lede">Each model run against your evidence base. Where several independently point at the same finding, that convergence is the most reliable signal in the analysis.</p>'+
      DATA.models.map(m=>
        renderModelVisual(m)+
        (m.narrative ? '<details class="sec" style="margin:-1rem 0 2rem"><summary><span class="sec-t">Interpretation</span><span class="sec-i">+</span></summary>'+
          '<div class="sec-body"><div class="output">'+md(m.narrative)+'</div></div></details>' : '')
      ).join('')+
      '</section>';
  }

  el('main').innerHTML=html;
  if(MODEL) recalc();
}

function go(n){
  CUR=n;
  document.querySelectorAll('.stage').forEach(s=>s.classList.remove('on'));
  const target=document.getElementById(n===-1?'st-1':n===-9?'st-9':'st'+n);
  if(target)target.classList.add('on');
  document.querySelectorAll('.sb-link').forEach((l,i)=>l.classList.toggle('active', i===(n===-1?0:n)));
  document.querySelector('.sidebar').classList.remove('open');
  window.scrollTo({top:0,behavior:'smooth'});
}

function boardPack(){
  const keep=['st1','st2','st6','st7'];
  document.querySelectorAll('.stage').forEach(s=>{ if(!keep.includes(s.id)) s.dataset.skip='1'; });
  const style=document.createElement('style');
  style.id='bp';
  style.textContent='@media print{.stage[data-skip="1"]{display:none!important}}';
  document.head.appendChild(style);
  window.print();
  setTimeout(()=>{document.querySelectorAll('.stage').forEach(s=>delete s.dataset.skip);const b=document.getElementById('bp');if(b)b.remove();},700);
}

let pIdx=0;
function startPresent(){document.body.classList.add('present');pIdx=0;pShow();}
function endPresent(){document.body.classList.remove('present');go(CUR);}
function pStep(d){const n=document.querySelectorAll('.stage').length;pIdx=Math.max(0,Math.min(n-1,pIdx+d));pShow();}
function pShow(){
  const secs=[...document.querySelectorAll('.stage')];
  secs.forEach((s,i)=>s.classList.toggle('on',i===pIdx));
  el('pCount').textContent=(pIdx+1)+' / '+secs.length;
  window.scrollTo(0,0);
}
document.addEventListener('keydown',e=>{
  if(!document.body.classList.contains('present'))return;
  if(e.key==='ArrowRight'||e.key===' ')pStep(1);
  if(e.key==='ArrowLeft')pStep(-1);
  if(e.key==='Escape')endPresent();
});

async function ask(){
  const q=el('q').value.trim(); if(!q)return;
  const btn=el('askBtn'),panel=el('answer');
  el('aq').textContent=q;
  el('ab').innerHTML='<p><span class="spin"></span>Analysing…</p>';
  panel.classList.add('on');
  btn.disabled=true;btn.textContent='…';

  const per=Math.floor(340000/Math.max(DATA.stages.length,1));
  const corpus=DATA.stages.map(s=>'───── STAGE '+s.stage_number+' — '+s.stage_name+' ─────\n'+(s.output_content||'').slice(0,per)).join('\n\n');
  const ctx='You are TransformOS, answering a question from the leadership team of '+
    (DATA.company.company_name||'this organisation')+' about their own transformation analysis. '+
    'The full engagement is below. Answer only from it. If something is not covered, say so plainly rather than inventing figures. '+
    'Where stages disagree or a later stage revises an earlier finding, say so explicitly. '+
    'Direct and commercially sharp. Distinguish evidenced fact from professional judgement. Under 220 words unless the question demands more. '+
    'Short plain paragraphs, no markdown headings, bold only the phrases that matter most.\n\n'+corpus;

  try{
    const r=await fetch(API+'/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-5',max_tokens:1200,system:ctx,messages:[{role:'user',content:q}]})});
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'request failed');
    el('ab').innerHTML=md((d.content||[]).filter(i=>i.type==='text').map(i=>i.text).join('\n'));
  }catch(e){ el('ab').innerHTML='<p style="color:#E07A5F">Could not answer: '+e.message+'</p>'; }
  btn.disabled=false;btn.textContent='Ask';el('q').value='';
}

/* auto-open from ?code= or a previous session */
(function(){
  const p=new URLSearchParams(location.search).get('code');
  const stored=sessionStorage.getItem('tos_portal_code');
  const code=p||stored;
  if(code){ el('gcode').value=code.toUpperCase(); openPortal(); }
  else el('gcode').focus();
})();
</script>
